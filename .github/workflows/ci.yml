name: Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  api:
    name: API Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore API tests
        run: dotnet restore tests/CarInsurance.Api.Tests/CarInsurance.Api.Tests.csproj

      - name: Build API
        run: dotnet build api/CarInsurance.Api.csproj -c Release --no-restore --nologo

      - name: Build API tests
        run: dotnet build tests/CarInsurance.Api.Tests/CarInsurance.Api.Tests.csproj -c Release --no-restore --nologo

      - name: Run API integration tests
        run: dotnet test tests/CarInsurance.Api.Tests/CarInsurance.Api.Tests.csproj -c Release --no-build --nologo --logger "console;verbosity=minimal"

  web:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build
